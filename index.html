<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  
  <!-- Google Fonts: Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=Outfit:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(-45deg, #000000, #4a0000, #800000, #1a0000);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating background particles */
    .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      background: rgba(255, 77, 77, 0.5);
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
      border-radius: 50%;
      animation: floatUp 8s linear infinite;
    }

    .particle:nth-child(1) { left: 10%; width: 14px; height: 14px; animation-duration: 7s; }
    .particle:nth-child(2) { left: 30%; width: 22px; height: 22px; animation-duration: 10s; animation-delay: 1s; }
    .particle:nth-child(3) { left: 50%; width: 10px; height: 10px; animation-duration: 6s; animation-delay: 2s; }
    .particle:nth-child(4) { left: 70%; width: 18px; height: 18px; animation-duration: 9s; animation-delay: 0.5s; }
    .particle:nth-child(5) { left: 85%; width: 12px; height: 12px; animation-duration: 8s; animation-delay: 3s; }
    .particle:nth-child(6) { left: 95%; width: 16px; height: 16px; animation-duration: 11s; animation-delay: 1.5s; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.9; }
      100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
    }

    /* --- TOP GOLDEN CELEBRATION LIGHT STRIPS --- */
    .lights-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .lights-wrapper.on {
      opacity: 1;
    }

    .light-wire {
      display: flex;
      justify-content: space-around;
      width: 100%;
      border-top: 2px solid rgba(255, 215, 0, 0.4);
      padding-top: 5px;
    }

    .light-wire.swag {
      margin-top: -10px;
    }

    .bulb {
      width: 14px;
      height: 22px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: #ffd700;
      box-shadow: 0 0 15px #ffd700, 0 0 30px #ffaa00, 0 0 45px #ffaa00;
      animation: glowGlow 1.2s infinite alternate ease-in-out;
      position: relative;
    }

    .bulb::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 3px;
      width: 8px;
      height: 4px;
      background: #888;
      border-radius: 2px;
    }

    .bulb:nth-child(even) {
      animation-delay: 0.4s;
      background: #fff0a6;
      box-shadow: 0 0 15px #fff0a6, 0 0 30px #ffd700, 0 0 45px #ffd700;
    }

    .bulb:nth-child(3n) {
      animation-delay: 0.8s;
      background: #ffae00;
      box-shadow: 0 0 15px #ffae00, 0 0 30px #ff7700, 0 0 45px #ff7700;
    }

    @keyframes glowGlow {
      0% {
        opacity: 0.4;
        transform: scale(0.9);
        box-shadow: 0 0 5px #ffd700;
      }
      100% {
        opacity: 1;
        transform: scale(1.1);
        box-shadow: 0 0 20px #ffd700, 0 0 35px #ffaa00, 0 0 50px #ffaa00;
      }
    }

    /* Content Layout */
    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 750px;
      margin: 20px auto;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* Top Left Fixed Back Button */
    .btn-corner-back {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 110;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .btn-corner-back:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateX(-3px);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    /* STEP 1: Name Input */
    .input-card {
      background: rgba(20, 0, 0, 0.65);
      border: 1px solid rgba(255, 0, 0, 0.3);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      border-radius: 20px;
    }

    .input-card h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .input-card input {
      width: 80%;
      max-width: 320px;
      padding: 12px 20px;
      font-size: 1.1rem;
      font-family: inherit;
      border-radius: 30px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      text-align: center;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-card input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
    }

    .btn-glow {
      margin-top: 1.5rem;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-family: inherit;
      font-weight: 600;
      color: #000;
      background: #ffffff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-glow:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 255, 255, 1), 0 0 45px rgba(255, 77, 77, 0.8);
    }

    /* STEP 2: Multilingual Greetings */
    .greeting-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
    }

    .hb-glow-text {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      margin-bottom: 0.5rem;
      min-height: 70px;
    }

    .fixed-name {
      font-family: 'Playfair Display', serif;
      font-size: 4.2rem;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      text-shadow: 
        0 0 10px #ffffff,
        0 0 20px #ffffff,
        0 0 40px rgba(255, 255, 255, 0.9),
        0 0 80px rgba(255, 77, 77, 0.8);
      margin-bottom: 2rem;
      line-height: 1.1;
    }

    .cursor {
      display: inline-block;
      width: 4px;
      height: 2.4rem;
      background-color: #ffffff;
      margin-left: 6px;
      box-shadow: 0 0 12px #ffffff;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* STEP 3: Turn On Lights Prompt */
    .lights-prompt-card {
      background: rgba(20, 0, 0, 0.75);
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    .lights-prompt-card h2 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
    }

    .lights-prompt-card p {
      font-size: 1.2rem;
      color: #ffd700;
      margin-bottom: 1.5rem;
    }

    /* STEP 4: Main Cake Content */
    .main-site-content {
      background: rgba(20, 0, 0, 0.75);
      border: 1px solid rgba(255, 77, 77, 0.4);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    /* Interactive Cake */
    .cake-container {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 20px auto;
      cursor: pointer;
    }

    .cake {
      width: 100%;
      height: 100%;
    }

    .flame {
      fill: #ff9d00;
      filter: drop-shadow(0 0 8px #ff4500) drop-shadow(0 0 15px #ffd700);
      transform-origin: center bottom;
      animation: flicker 0.6s ease-in-out infinite alternate;
      transition: opacity 0.5s ease;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(2deg); }
    }

    .flame.blown-out {
      opacity: 0;
      animation: none;
    }

    .wish-text {
      font-size: 1.2rem;
      color: #ffcccc;
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Golden Celebration Lights Strips (Fixed on top) -->
  <div id="lights-strip" class="lights-wrapper">
    <div class="light-wire">
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    </div>
    <div class="light-wire swag">
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    </div>
  </div>

  <!-- Background Animated Particles -->
  <div class="particle-container">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- FIXED CORNER BACK BUTTON -->
  <button id="corner-back-btn" class="btn-corner-back hidden" onclick="handleCornerBack()">
    <i class="fa-solid fa-arrow-left"></i> Back
  </button>

  <div class="content-wrapper">

    <!-- STEP 1: Ask for Name -->
    <div id="step-name" class="input-card">
      <h2>Who is the birthday star? 👑</h2>
      <input type="text" id="user-name-input" placeholder="Enter name here..." autocomplete="off" onkeydown="handleKeyPress(event)">
      <br>
      <button class="btn-glow" onclick="startGreeting()">Celebrate 🎉</button>
    </div>

    <!-- STEP 2: Multilingual Typewriter Greeting -->
    <div id="step-greeting" class="greeting-container hidden">
      <h2 class="hb-glow-text">
        <span id="typewriter-text"></span><span class="cursor"></span>
      </h2>
      <h1 id="user-name-display" class="fixed-name"></h1>
      <button class="btn-glow" onclick="goToLightsStep()">Open Surprise 🎁</button>
    </div>

    <!-- STEP 3: Turn On Lights Prompt -->
    <div id="step-lights" class="lights-prompt-card hidden">
      <h2>Set the Celebration Mood! ✨</h2>
      <p>Tap below to illuminate the party lights before your cake arrives!</p>
      <button class="btn-glow" onclick="turnOnLightsAndShowCake()">Turn On Lights ✨</button>
    </div>

    <!-- STEP 4: Interactive Birthday Cake -->
    <div id="step-main" class="main-site-content hidden">
      <h2 id="welcome-header" style="font-family: 'Playfair Display', serif; font-size: 2.8rem; font-style: italic; font-weight: 900; margin-bottom: 0.5rem; text-shadow: 0 0 15px #ff4d4d;"></h2>
      <p class="wish-text">Make a wish and click the cake or candles to blow them out! 🕯️</p>

      <!-- SVG Cake -->
      <div class="cake-container" onclick="blowCandles()">
        <svg class="cake" viewBox="0 0 200 200">
          <ellipse cx="100" cy="170" rx="85" ry="18" fill="#e0e0e0" stroke="#cccccc" stroke-width="2"/>
          <ellipse cx="100" cy="168" rx="75" ry="14" fill="#ffffff"/>
          
          <path d="M 30 120 L 30 155 Q 100 180 170 155 L 170 120 Z" fill="#3a1c14"/>
          <ellipse cx="100" cy="120" rx="70" ry="15" fill="#5c2c1d"/>
          
          <path d="M 30 120 Q 100 135 170 120 Q 170 110 170 100 Q 100 115 30 100 Z" fill="#ff4d4d"/>
          
          <path d="M 35 75 L 35 105 Q 100 125 165 105 L 165 75 Z" fill="#3a1c14"/>
          <ellipse cx="100" cy="75" rx="65" ry="14" fill="#ff6b6b"/>

          <path d="M 35 75 Q 45 90 55 75 Q 65 95 75 75 Q 85 90 95 75 Q 105 95 115 75 Q 125 90 135 75 Q 145 95 155 75 Q 165 85 165 75 Z" fill="#ffffff"/>

          <!-- Candle 1 -->
          <rect x="65" y="45" width="8" height="32" rx="3" fill="#33ffff"/>
          <line x1="69" y1="45" x2="69" y2="39" stroke="#000" stroke-width="2"/>
          <path id="flame1" class="flame" d="M 69 22 Q 74 32 69 39 Q 64 32 69 22 Z"/>

          <!-- Candle 2 -->
          <rect x="96" y="40" width="8" height="35" rx="3" fill="#ff3399"/>
          <line x1="100" y1="40" x2="100" y2="34" stroke="#000" stroke-width="2"/>
          <path id="flame2" class="flame" d="M 100 17 Q 105 27 100 34 Q 95 27 100 17 Z"/>

          <!-- Candle 3 -->
          <rect x="127" y="45" width="8" height="32" rx="3" fill="#ffff33"/>
          <line x1="131" y1="45" x2="131" y2="39" stroke="#000" stroke-width="2"/>
          <path id="flame3" class="flame" d="M 131 22 Q 136 32 131 22 Z"/>
        </svg>
      </div>

      <button id="blow-btn" class="btn-glow" onclick="blowCandles()">Blow Out Candles 🎂</button>
    </div>

  </div>

  <script>
    let userName = "Friend";
    let langIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    let typewriterTimeout = null;
    let candlesBlown = false;
    let currentStep = 1;

    const happyBirthdayLanguages = [
      "Happy Birthday,",       // English
      "¡Feliz Cumpleaños,",     // Spanish
      "Joyeux Anniversaire,",  // French
      "Alles Gute zum Geburtstag,", // German
      "お誕生日おめでとう,",       // Japanese
      "जन्मदिन की शुभकामनाएं,",  // Hindi
      "Buon Compleanno,",      // Italian
      "생일 축하해요,",           // Korean
      "Feliz Aniversário,",    // Portuguese
      "С Днем Рождения,"       // Russian
    ];

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        startGreeting();
      }
    }

    function startGreeting() {
      const inputVal = document.getElementById("user-name-input").value.trim();
      if (inputVal !== "") {
        userName = inputVal;
      }

      currentStep = 2;

      document.getElementById("step-name").classList.add("hidden");
      document.getElementById("step-greeting").classList.remove("hidden");
      document.getElementById("corner-back-btn").classList.remove("hidden");
      
      document.getElementById("user-name-display").innerText = userName;

      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      langIndex = 0;
      charIndex = 0;
      isDeleting = false;
      clearTimeout(typewriterTimeout);
      typewriterLoop();
    }

    function typewriterLoop() {
      const currentPhrase = happyBirthdayLanguages[langIndex];
      const typewriterEl = document.getElementById("typewriter-text");

      if (isDeleting) {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex + 1);
        charIndex++;
      }

      let typingSpeed = isDeleting ? 40 : 80;

      if (!isDeleting && charIndex === currentPhrase.length) {
        typingSpeed = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        langIndex = (langIndex + 1) % happyBirthdayLanguages.length;
        typingSpeed = 300;
      }

      typewriterTimeout = setTimeout(typewriterLoop, typingSpeed);
    }

    function goToLightsStep() {
      clearTimeout(typewriterTimeout);
      currentStep = 3;
      document.getElementById("step-greeting").classList.add("hidden");
      document.getElementById("step-lights").classList.remove("hidden");
    }

    function turnOnLightsAndShowCake() {
      // Turn on top golden light strip
      document.getElementById("lights-strip").classList.add("on");

      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.2 }
      });

      // Show Cake step after short delay
      setTimeout(() => {
        currentStep = 4;
        document.getElementById("step-lights").classList.add("hidden");
        document.getElementById("step-main").classList.remove("hidden");
        document.getElementById("welcome-header").innerText = `Happy Birthday, ${userName}! 🎉`;

        confetti({
          particleCount: 150,
          spread: 100,
          origin: { y: 0.5 }
        });
      }, 600);
    }

    function handleCornerBack() {
      if (currentStep === 4) {
        // Back from Cake to Lights Prompt
        document.getElementById("step-main").classList.add("hidden");
        document.getElementById("step-lights").classList.remove("hidden");
        document.getElementById("lights-strip").classList.remove("on");
        currentStep = 3;
      } else if (currentStep === 3) {
        // Back from Lights Prompt to Greeting Screen
        document.getElementById("step-lights").classList.add("hidden");
        document.getElementById("step-greeting").classList.remove("hidden");
        currentStep = 2;
        langIndex = 0;
        charIndex = 0;
        isDeleting = false;
        clearTimeout(typewriterTimeout);
        typewriterLoop();
      } else if (currentStep === 2) {
        // Back from Greeting Screen to Name Input
        clearTimeout(typewriterTimeout);
        document.getElementById("step-greeting").classList.add("hidden");
        document.getElementById("corner-back-btn").classList.add("hidden");
        document.getElementById("step-name").classList.remove("hidden");
        currentStep = 1;
      }
    }

    function blowCandles() {
      if (candlesBlown) return;
      candlesBlown = true;

      document.getElementById("flame1").classList.add("blown-out");
      document.getElementById("flame2").classList.add("blown-out");
      document.getElementById("flame3").classList.add("blown-out");

      document.querySelector(".wish-text").innerText = "Your wish has been made! ✨";
      document.getElementById("blow-btn").innerText = "Wish Made! 🎉";

      confetti({
        particleCount: 200,
        spread: 120,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
