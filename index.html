<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none !important;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: #000000;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* Custom Red / Ink Black Cursor Dot */
    .custom-cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999999;
      transform: translate(-50%, -50%);
      background: #ff3344;
      box-shadow: 0 0 20px rgba(255, 51, 68, 0.9);
      transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease-out;
      will-change: transform, left, top;
    }

    .custom-cursor-dot.dark-mode {
      background: #000000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.95);
    }

    /* LAYER 1: Underneath Oppositional Gradient */
    .bg-gradient-underneath {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #e60026 0%, #7a0010 40%, #200004 70%, #000000 100%);
      z-index: 0;
    }

    /* LAYER 2: Canvas Mask Top Gradient */
    #fluid-mask-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Ambient Overlay */
    .ambient-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(255, 120, 50, 0.2) 0%, rgba(0, 0, 0, 0.85) 85%);
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    body.lights-active .ambient-overlay {
      opacity: 1;
    }

    /* BLOOMING SUNFLOWERS CONTAINER FOR STEP 1 */
    .sunflowers-bloom-wrapper {
      width: 100%;
      max-width: 500px;
      height: 90px;
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      position: relative;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .sunflowers-bloom-wrapper.fade-out {
      opacity: 0;
    }

    /* Aesthetic Mini Sunflower Element */
    .mini-sunflower {
      width: 42px;
      height: 42px;
      opacity: 0;
      transform: scale(0) rotate(-45deg);
      animation: bloomIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      filter: drop-shadow(0 0 10px rgba(255, 191, 0, 0.6));
    }

    .mini-sunflower:nth-child(1) { animation-delay: 0.2s; }
    .mini-sunflower:nth-child(2) { animation-delay: 0.4s; }
    .mini-sunflower:nth-child(3) { animation-delay: 0.6s; }
    .mini-sunflower:nth-child(4) { animation-delay: 0.8s; }
    .mini-sunflower:nth-child(5) { animation-delay: 1.0s; }
    .mini-sunflower:nth-child(6) { animation-delay: 1.2s; }

    @keyframes bloomIn {
      0% { opacity: 0; transform: scale(0) rotate(-60deg); }
      70% { opacity: 1; transform: scale(1.15) rotate(10deg); }
      100% { opacity: 0.95; transform: scale(1) rotate(0deg); }
    }

    /* Festoon String Lights */
    .lights-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .lights-wrapper.on {
      opacity: 1;
      transform: translateY(0);
    }

    .lights-wrapper.scrolled-hidden {
      opacity: 0 !important;
      transform: translateY(-20px) !important;
    }

    .light-wire-main {
      display: flex;
      justify-content: space-around;
      width: 100%;
      border-top: 2px solid rgba(255, 180, 50, 0.7);
      padding-top: 2px;
    }

    .bulb-socket {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .socket {
      width: 8px;
      height: 6px;
      background: #333;
    }

    .bulb-gold {
      width: 15px;
      height: 24px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #ffb700 85%);
      box-shadow: 0 0 18px #ffcc00, 0 0 38px #ff8800;
      animation: warmGlow 1.8s infinite alternate ease-in-out;
    }

    @keyframes warmGlow {
      0% { opacity: 0.7; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 28px #ffe066, 0 0 50px #ff8800; }
    }

    /* Navigation Button */
    .btn-corner-back {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 110;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .btn-corner-back:hover {
      background: rgba(255, 77, 77, 0.4);
      border-color: #ff4d4d;
    }

    /* Page Sections */
    .fullpage-section {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    /* Scroll Prompt Indicator */
    .scroll-hint-prompt {
      margin-top: 2rem;
      font-size: 0.95rem;
      color: #ffc2c6;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: bouncePrompt 2s infinite ease-in-out;
      opacity: 0.9;
    }

    @keyframes bouncePrompt {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* Typography & Inputs */
    h2 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    .input-field {
      width: 100%;
      max-width: 340px;
      padding: 14px 24px;
      font-size: 1.1rem;
      font-family: inherit;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      text-align: center;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #ff4d5a;
      box-shadow: 0 0 25px rgba(255, 77, 90, 0.7);
    }

    .btn-glow {
      margin-top: 1.8rem;
      padding: 14px 38px;
      font-size: 1.05rem;
      font-family: inherit;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #a3000f, #570008);
      border: 1px solid rgba(255, 120, 120, 0.5);
      border-radius: 35px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8), 0 0 20px rgba(220, 0, 30, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-glow:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #c40012, #7a000b);
      box-shadow: 0 0 30px rgba(255, 50, 70, 0.9);
    }

    .greeting-container {
      text-align: center;
    }

    .hb-glow-text {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
      min-height: 80px;
    }

    .fixed-name {
      font-family: 'Playfair Display', serif;
      font-size: 4.8rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 25px #ff3344, 0 0 60px rgba(255, 0, 40, 0.9);
      margin-bottom: 2.5rem;
    }

    .cursor {
      display: inline-block;
      width: 4px;
      height: 2.6rem;
      background-color: #ffffff;
      margin-left: 6px;
      box-shadow: 0 0 12px #ffffff;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Cake Elements */
    .cake-container {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 10px auto;
    }

    .cake {
      width: 100%;
      height: 100%;
    }

    .flame {
      fill: #ff9d00;
      filter: drop-shadow(0 0 10px #ff4500) drop-shadow(0 0 20px #ffd700);
      transform-origin: center bottom;
      animation: flicker 0.6s ease-in-out infinite alternate;
      transition: opacity 0.5s ease;
      opacity: 1;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.12) rotate(2deg); }
    }

    .flame.blown-out {
      opacity: 0 !important;
      animation: none !important;
    }

    .wish-text {
      font-size: 1.2rem;
      color: #ffb3b8;
      margin-top: 10px;
      text-align: center;
    }

    /* Music Player Layout */
    .music-section-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .music-taste-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 0 25px rgba(255, 77, 90, 0.8);
    }

    .music-dual-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      margin-top: 1rem;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .music-dual-container.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* Vinyl Player */
    .vinyl-player-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .album-display {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .album-cover {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle at 35% 35%, #a80e1a, #4a0006);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.95), inset 0 0 35px rgba(0, 0, 0, 0.7);
      border-radius: 4px;
      position: absolute;
      left: 0;
      top: 10px;
      z-index: 3;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .vinyl-record {
      width: 270px;
      height: 270px;
      position: absolute;
      right: -70px;
      top: 15px;
      z-index: 2;
      border-radius: 50%;
      background: #0d0d0d;
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.9);
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .vinyl-record.spinning {
      animation: spinVinyl 4s linear infinite;
      right: -90px;
    }

    @keyframes spinVinyl {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .audio-player-controls {
      width: 100%;
      max-width: 380px;
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .track-title {
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: #ffb3b8;
      letter-spacing: 1px;
      text-align: center;
    }

    /* Celestial White Glow Particle Progress Bar */
    .progress-bar-wrap {
      position: relative;
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer !important;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 0%;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 35px #ffffff;
      border-radius: 6px;
      transition: width 0.1s linear;
      pointer-events: none;
    }

    .particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    .time-indicators {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: -2px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 6px;
    }

    .player-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.25s ease;
    }

    .player-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    .play-btn-large {
      width: 56px;
      height: 56px;
      font-size: 1.3rem;
      background: #ffffff;
      color: #000000;
      border: none;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }

    .play-btn-large:hover {
      background: #f0f0f0;
      box-shadow: 0 0 30px rgba(255, 255, 255, 1);
    }

    /* Playlist Section (Right) */
    .playlist-right {
      flex: 1;
      max-width: 420px;
      background: rgba(15, 15, 15, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .playlist-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffb3b8;
    }

    .song-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      transition: all 0.25s ease;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .song-item.active-song {
      background: rgba(255, 255, 255, 0.18);
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .song-info {
      display: flex;
      flex-direction: column;
    }

    .song-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
    }

    .song-artist {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .play-icon-small {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>

  <!-- Custom Cursor Dot -->
  <div id="dot-cursor" class="custom-cursor-dot"></div>

  <!-- Background Layers -->
  <div class="bg-gradient-underneath"></div>
  <canvas id="fluid-mask-canvas"></canvas>
  <div class="ambient-overlay"></div>

  <!-- Top Navigation Corner Button -->
  <button id="corner-back-btn" class="btn-corner-back hidden" onclick="handleCornerBack()">
    <i class="fa-solid fa-arrow-left"></i> Back
  </button>

  <!-- Festoon String Lights -->
  <div id="lights-strip" class="lights-wrapper">
    <div class="light-wire-main">
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
    </div>
  </div>

  <!-- STEP 1: ENTER NAME -->
  <section id="step-name" class="fullpage-section">
    <h2>Enter Your Name</h2>
    <input type="text" id="user-name-input" class="input-field" placeholder="Type here..." onkeypress="handleKeyPress(event)" />
    <button class="btn-glow" onclick="startGreeting()">Continue ✨</button>

    <div id="sunflowers-garden" class="sunflowers-bloom-wrapper">
      <svg class="mini-sunflower" viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="#3b1d00"/><path d="M50 10 L55 32 L50 30 L45 32 Z" fill="#ffb700"/><path d="M50 90 L55 68 L50 70 L45 68 Z" fill="#ffb700"/><path d="M10 50 L32 55 L30 50 L32 45 Z" fill="#ffb700"/><path d="M90 50 L68 55 L70 50 L68 45 Z" fill="#ffb700"/><path d="M22 22 L40 38 L36 36 L38 40 Z" fill="#ffa000"/><path d="M78 78 L60 62 L64 64 L62 60 Z" fill="#ffa000"/><path d="M22 78 L38 60 L36 64 L40 62 Z" fill="#ffa000"/><path d="M78 22 L60 38 L64 36 L62 40 Z" fill="#ffa000"/></svg>
      <svg class="mini-sunflower" viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="#3b1d00"/><path d="M50 10 L55 32 L50 30 L45 32 Z" fill="#ffb700"/><path d="M50 90 L55 68 L50 70 L45 68 Z" fill="#ffb700"/><path d="M10 50 L32 55 L30 50 L32 45 Z" fill="#ffb700"/><path d="M90 50 L68 55 L70 50 L68 45 Z" fill="#ffb700"/><path d="M22 22 L40 38 L36 36 L38 40 Z" fill="#ffa000"/><path d="M78 78 L60 62 L64 64 L62 60 Z" fill="#ffa000"/><path d="M22 78 L38 60 L36 64 L40 62 Z" fill="#ffa000"/><path d="M78 22 L60 38 L64 36 L62 40 Z" fill="#ffa000"/></svg>
      <svg class="mini-sunflower" viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="#3b1d00"/><path d="M50 10 L55 32 L50 30 L45 32 Z" fill="#ffb700"/><path d="M50 90 L55 68 L50 70 L45 68 Z" fill="#ffb700"/><path d="M10 50 L32 55 L30 50 L32 45 Z" fill="#ffb700"/><path d="M90 50 L68 55 L70 50 L68 45 Z" fill="#ffb700"/><path d="M22 22 L40 38 L36 36 L38 40 Z" fill="#ffa000"/><path d="M78 78 L60 62 L64 64 L62 60 Z" fill="#ffa000"/><path d="M22 78 L38 60 L36 64 L40 62 Z" fill="#ffa000"/><path d="M78 22 L60 38 L64 36 L62 40 Z" fill="#ffa000"/></svg>
      <svg class="mini-sunflower" viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="#3b1d00"/><path d="M50 10 L55 32 L50 30 L45 32 Z" fill="#ffb700"/><path d="M50 90 L55 68 L50 70 L45 68 Z" fill="#ffb700"/><path d="M10 50 L32 55 L30 50 L32 45 Z" fill="#ffb700"/><path d="M90 50 L68 55 L70 50 L68 45 Z" fill="#ffb700"/><path d="M22 22 L40 38 L36 36 L38 40 Z" fill="#ffa000"/><path d="M78 78 L60 62 L64 64 L62 60 Z" fill="#ffa000"/><path d="M22 78 L38 60 L36 64 L40 62 Z" fill="#ffa000"/><path d="M78 22 L60 38 L64 36 L62 40 Z" fill="#ffa000"/></svg>
      <svg class="mini-sunflower" viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="#3b1d00"/><path d="M50 10 L55 32 L50 30 L45 32 Z" fill="#ffb700"/><path d="M50 90 L55 68 L50 70 L45 68 Z" fill="#ffb700"/><path d="M10 50 L32 55 L30 50 L32 45 Z" fill="#ffb700"/><path d="M90 50 L68 55 L70 50 L68 45 Z" fill="#ffb700"/><path d="M22 22 L40 38 L36 36 L38 40 Z" fill="#ffa000"/><path d="M78 78 L60 62 L64 64 L62 60 Z" fill="#ffa000"/><path d="M22 78 L38 60 L36 64 L40 62 Z" fill="#ffa000"/><path d="M78 22 L60 38 L64 36 L62 40 Z" fill="#ffa000"/></svg>

  <!-- STEP 2: MULTILINGUAL GREETING -->
  <section id="step-greeting" class="fullpage-section hidden">

  <!-- STEP 3: LIGHTS STEP -->
  <section id="step-lights" class="fullpage-section hidden">

  <!-- STEP 4: CAKE & WISH -->
  <section id="step-main" class="fullpage-section hidden">
    <h2 id="welcome-header">Happy Birthday! 🎉</h2>
    
    <div class="cake-container">

  <!-- STEP 5: TWO COLUMN MUSIC PLAYER SECTION -->
  <section id="step-playlist" class="fullpage-section hidden">
    <div class="music-section-wrapper">

                <text x="150" y="156" font-family="Space Mono, monospace" font-size="5" fill="#d8b4fe" text-anchor="middle">STEREO</text>

          <div class="audio-player-controls">

            <div class="progress-bar-wrap" id="progress-container" onclick="seekTrack(event)">

              <button class="player-btn" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
              <button class="player-btn play-btn-large" id="play-toggle-btn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>

            <!-- Dynamic items generated via JavaScript -->

  <script>
    /* CURSOR DOT SETUP */
    const dotCursor = document.getElementById('dot-cursor');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      const elem = document.elementFromPoint(e.clientX, e.clientY);
      if (elem) {
        const tag = elem.tagName.toLowerCase();
        if (tag === 'input' || tag === 'button' || elem.classList.contains('playlist-right') || tag === 'h1') {
          dotCursor.classList.add('dark-mode');
        } else {
          dotCursor.classList.remove('dark-mode');
        }
      }
    });

    function renderCursor() {
      cursorX += (mouseX - cursorX) * 0.22;
      cursorY += (mouseY - cursorY) * 0.22;
      dotCursor.style.left = `${cursorX}px`;
      dotCursor.style.top = `${cursorY}px`;
      requestAnimationFrame(renderCursor);
    }
    renderCursor();

    /* SHAPELESS FLOWING ORGANIC LIQUID MASK ENGINE */
    const canvas = document.getElementById('fluid-mask-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawTopGradientLayer();
    }

    function drawTopGradientLayer() {
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#000000');
      grad.addColorStop(0.3, '#1f0004');
      grad.addColorStop(0.7, '#6b000d');
      grad.addColorStop(1, '#e60026');

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const NUM_NODES = 12;
    let fluidNodes = [];
    
    for (let i = 0; i < NUM_NODES; i++) {
      fluidNodes.push({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        vx: 0,
        vy: 0,
        radius: 45 + Math.random() * 35,
        phase: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.03 + Math.random() * 0.04
      });
    }

    function renderOrganicLiquidMask() {
      drawTopGradientLayer();
      ctx.globalCompositeOperation = 'destination-out';

      fluidNodes[0].x += (mouseX - fluidNodes[0].x) * 0.18;
      fluidNodes[0].y += (mouseY - fluidNodes[0].y) * 0.18;

      for (let i = 1; i < NUM_NODES; i++) {
        const prev = fluidNodes[i - 1];
        const current = fluidNodes[i];
        
        current.x += (prev.x - current.x) * (0.28 - i * 0.015);
        current.y += (prev.y - current.y) * (0.28 - i * 0.015);
        current.phase += current.wobbleSpeed;
      }

      ctx.save();
      ctx.shadowBlur = 45;
      ctx.shadowColor = 'rgba(0, 0, 0, 1)';
      ctx.fillStyle = 'rgba(0, 0, 0, 1)';

      for (let i = 0; i < NUM_NODES; i++) {
        const node = fluidNodes[i];
        const dynamicRadius = node.radius + Math.sin(node.phase) * 12;
        
        ctx.beginPath();
        ctx.arc(node.x, node.y, Math.max(10, dynamicRadius - i * 2.5), 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.moveTo(fluidNodes[0].x, fluidNodes[0].y);
      for (let i = 0; i < NUM_NODES - 1; i++) {
        const xc = (fluidNodes[i].x + fluidNodes[i + 1].x) / 2;
        const yc = (fluidNodes[i].y + fluidNodes[i + 1].y) / 2;
        ctx.quadraticCurveTo(fluidNodes[i].x, fluidNodes[i].y, xc, yc);
      }
      ctx.lineWidth = 75;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(0, 0, 0, 1)';
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(renderOrganicLiquidMask);
    }
    renderOrganicLiquidMask();

    /* APP FLOW LOGIC */
    let userName = "Star";
    let langIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    let typewriterTimeout = null;
    let candlesBlown = false;
    let currentStep = 1;

    /* AUDIO ENGINE CONFIGURATION */
    const audioPlayer = new Audio();
    let isPlaying = false;
    let currentTrackIdx = 0;

    // Relative path to local GitHub project folder "audio"
    const playlist = [
      { 
        title: "Khat (Official Audio)", 
        artist: "Navjot Ahuja", 
        src: "audio/Navjot Ahuja - Khat (Official Audio) .mp3" 
      }
    ];

    const happyBirthdayLanguages = [
      "Happy Birthday,",
      "¡Feliz Cumpleaños,",
      "Joyeux Anniversaire,",
      "Alles Gute zum Geburtstag,",
      "お誕生日おめでとう,",
      "जन्मदिन की शुभकामनाएं,",
      "Buon Compleanno,",
      "생일 축हा해요,",
      "Feliz Aniversário,"
    ];

    // Render playlist elements dynamically
    function renderPlaylistUI() {
      const listContainer = document.getElementById("song-list-items");
      listContainer.innerHTML = "";

      playlist.forEach((track, idx) => {
        const li = document.createElement("li");
        li.className = `song-item ${idx === currentTrackIdx ? 'active-song' : ''}`;
        li.onclick = () => selectTrack(idx);

        li.innerHTML = `
          <div class="song-info">
            <span class="song-name">${track.title}</span>
            <span class="song-artist">${track.artist}</span>
          </div>
          <i class="fa-solid fa-${idx === currentTrackIdx && isPlaying ? 'pause' : 'play'} play-icon-small"></i>
        `;
        listContainer.appendChild(li);
      });
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") startGreeting();
    }

    function startGreeting() {
      const inputVal = document.getElementById("user-name-input").value.trim();
      if (inputVal !== "") userName = inputVal;

      const sunflowers = document.getElementById("sunflowers-garden");
      sunflowers.classList.add("fade-out");

      setTimeout(() => {
        currentStep = 2;
        document.getElementById("step-name").classList.add("hidden");
        document.getElementById("step-greeting").classList.remove("hidden");
        document.getElementById("corner-back-btn").classList.remove("hidden");
        document.getElementById("user-name-display").innerText = userName;

        document.getElementById("music-taste-header").innerText = `${userName}'s Sound Track ✨`;

        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

        langIndex = 0;
        charIndex = 0;
        isDeleting = false;
        clearTimeout(typewriterTimeout);
        typewriterLoop();
      }, 400);
    }

    function typewriterLoop() {
      const currentPhrase = happyBirthdayLanguages[langIndex];
      const typewriterEl = document.getElementById("typewriter-text");

      if (isDeleting) {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex + 1);
        charIndex++;
      }

      let typingSpeed = isDeleting ? 40 : 80;

      if (!isDeleting && charIndex === currentPhrase.length) {
        typingSpeed = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        langIndex = (langIndex + 1) % happyBirthdayLanguages.length;
        typingSpeed = 300;
      }

      typewriterTimeout = setTimeout(typewriterLoop, typingSpeed);
    }

    function goToLightsStep() {
      clearTimeout(typewriterTimeout);
      currentStep = 3;
      document.getElementById("step-greeting").classList.add("hidden");
      document.getElementById("step-lights").classList.remove("hidden");
    }

    function turnOnLightsAndShowCake() {
      document.body.classList.add("lights-active");
      document.getElementById("lights-strip").classList.add("on");

      confetti({ particleCount: 90, spread: 80, origin: { y: 0.2 } });

      setTimeout(() => {
        currentStep = 4;
        document.getElementById("step-lights").classList.add("hidden");
        document.getElementById("step-main").classList.remove("hidden");
        document.getElementById("step-playlist").classList.remove("hidden");
        document.getElementById("welcome-header").innerText = `Happy Birthday, ${userName}! 🎉`;

        confetti({ particleCount: 140, spread: 100, origin: { y: 0.5 } });
      }, 700);
    }

    function handleCornerBack() {
      if (currentStep === 4) {
        document.getElementById("step-main").classList.add("hidden");
        document.getElementById("step-playlist").classList.add("hidden");
        document.getElementById("step-lights").classList.remove("hidden");
        document.getElementById("lights-strip").classList.remove("on");
        document.body.classList.remove("lights-active");
        if (isPlaying) togglePlay();
        currentStep = 3;
      } else if (currentStep === 3) {
        document.getElementById("step-lights").classList.add("hidden");
        document.getElementById("step-greeting").classList.remove("hidden");
        currentStep = 2;
        langIndex = 0;
        charIndex = 0;
        isDeleting = false;
        clearTimeout(typewriterTimeout);
        typewriterLoop();
      } else if (currentStep === 2) {
        clearTimeout(typewriterTimeout);
        document.getElementById("step-greeting").classList.add("hidden");
        document.getElementById("corner-back-btn").classList.add("hidden");
        
        const sunflowers = document.getElementById("sunflowers-garden");
        sunflowers.classList.remove("fade-out");
        
        document.getElementById("step-name").classList.remove("hidden");
        currentStep = 1;
      }
    }

    function blowCandles() {
      if (candlesBlown) return;
      candlesBlown = true;

      document.getElementById("flame1").classList.add("blown-out");
      document.getElementById("flame2").classList.add("blown-out");
      document.getElementById("flame3").classList.add("blown-out");

      document.querySelector(".wish-text").innerText = "Your wish has been made! ✨";
      document.getElementById("blow-btn").innerText = "Wish Made! 🎉";

      confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 } });
    }

    /* Scroll Observer for Music reveal */
    const musicSection = document.getElementById('step-playlist');
    const lightsStrip = document.getElementById('lights-strip');
    const musicContainer = document.getElementById('music-dual-container');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          lightsStrip.classList.add('scrolled-hidden');
          musicContainer.classList.add('revealed');
        } else {
          lightsStrip.classList.remove('scrolled-hidden');
          musicContainer.classList.remove('revealed');
        }
      });
    }, { threshold: 0.25 });

    observer.observe(musicSection);

    /* CELESTIAL PARTICLE PROGRESS BAR ENGINE */
    const pCanvas = document.getElementById("timeline-particle-canvas");
    const pCtx = pCanvas.getContext("2d");
    const pContainer = document.getElementById("progress-container");
    let celestialParticles = [];

    function resizeParticleCanvas() {
      pCanvas.width = pContainer.clientWidth;
      pCanvas.height = pContainer.clientHeight;
    }
    window.addEventListener("resize", resizeParticleCanvas);

    function spawnCelestialParticles(frontX) {
      for (let i = 0; i < 3; i++) {
        celestialParticles.push({
          x: frontX,
          y: Math.random() * pCanvas.height,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 1.5,
          size: Math.random() * 2.5 + 1,
          alpha: 1
        });
      }
    }

    function renderCelestialParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      for (let i = celestialParticles.length - 1; i >= 0; i--) {
        let p = celestialParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;

        if (p.alpha <= 0) {
          celestialParticles.splice(i, 1);
          continue;
        }

        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        pCtx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        pCtx.shadowBlur = 8;
        pCtx.shadowColor = "#ffffff";
        pCtx.fill();
      }
      requestAnimationFrame(renderCelestialParticles);
    }
    renderCelestialParticles();

    /* AUDIO PLAYER HANDLERS */
    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateTrackDisplay() {
      const track = playlist[currentTrackIdx];
      document.getElementById("track-name").innerText = `${track.artist} - ${track.title}`;
      
      audioPlayer.src = track.src;
      audioPlayer.load();
      renderPlaylistUI();
    }

    function togglePlay() {
      const vinyl = document.getElementById("vinyl-disc");
      const playBtn = document.getElementById("play-toggle-btn");

      if (!isPlaying) {
        if (!audioPlayer.src || audioPlayer.src === "" || audioPlayer.src.endsWith("/")) {
          audioPlayer.src = playlist[currentTrackIdx].src;
        }
        audioPlayer.play().then(() => {
          isPlaying = true;
          vinyl.classList.add("spinning");
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
          renderPlaylistUI();
        }).catch(err => {
          console.warn("Audio play prevented:", err);
        });
      } else {
        audioPlayer.pause();
        isPlaying = false;
        vinyl.classList.remove("spinning");
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        renderPlaylistUI();
      }
    }

    function selectTrack(idx) {
      currentTrackIdx = idx;
      updateTrackDisplay();
      if (!isPlaying) {
        togglePlay();
      } else {
        audioPlayer.play().catch(e => console.warn(e));
      }
    }

    function nextTrack() {
      currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
      updateTrackDisplay();
      if (isPlaying) audioPlayer.play().catch(e => console.warn(e));
    }

    function prevTrack() {
      currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length;
      updateTrackDisplay();
      if (isPlaying) audioPlayer.play().catch(e => console.warn(e));
    }

    function seekTrack(event) {
      const container = document.getElementById("progress-container");
      const rect = container.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const width = rect.width;
      const seekRatio = clickX / width;

      if (audioPlayer.duration) {
        audioPlayer.currentTime = seekRatio * audioPlayer.duration;
      }
    }

    /* Audio Progress Updates */
    audioPlayer.addEventListener("timeupdate", () => {
      if (audioPlayer.duration) {
        if (pCanvas.width === 0) resizeParticleCanvas();
        const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        document.getElementById("progress-bar-fill").style.width = `${pct}%`;
        document.getElementById("time-current").innerText = formatTime(audioPlayer.currentTime);
        document.getElementById("time-duration").innerText = formatTime(audioPlayer.duration);

        if (isPlaying) {
          const frontX = (pct / 100) * pCanvas.width;
          spawnCelestialParticles(frontX);
        }
      }
    });

    audioPlayer.addEventListener("ended", () => {
      nextTrack();
    });

    // Initialize initial track and playlist UI
    updateTrackDisplay();
  </script>
