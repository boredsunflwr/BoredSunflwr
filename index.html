<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0c20, #1a103c, #2b0836);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    /* Hanging Lights */
    #lights-strip {
      display: flex;
      justify-content: space-around;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      transition: opacity 0.5s ease;
      padding: 10px 0;
      background: rgba(0, 0, 0, 0.2);
    }

    .light-bulb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px #fff;
      animation: glow 1.2s infinite alternate;
    }

    .light-bulb:nth-child(2n) { animation-delay: 0.3s; background: #ff3366; box-shadow: 0 0 10px #ff3366; }
    .light-bulb:nth-child(3n) { animation-delay: 0.6s; background: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
    .light-bulb:nth-child(4n) { animation-delay: 0.9s; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }

    @keyframes glow {
      from { opacity: 0.3; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.1); }
    }

    .scrolled-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Nav Back Button */
    #corner-back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 110;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s;
    }

    #corner-back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Container layouts */
    .container {
      width: 90%;
      max-width: 600px;
      margin-top: 100px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* Card Box */
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    input[type="text"] {
      width: 80%;
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 1rem;
      margin-top: 15px;
      text-align: center;
    }

    button.btn {
      padding: 12px 28px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(45deg, #ff3366, #ff6b8b);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
    }

    /* Typewriter Text */
    #typewriter {
      font-size: 2rem;
      font-weight: bold;
      min-height: 60px;
      color: #ffcc00;
    }

    /* Birthday Cake Styling */
    .cake-container {
      position: relative;
      margin: 40px auto 20px;
      width: 150px;
      height: 120px;
    }

    .cake-base {
      position: absolute;
      bottom: 0;
      width: 150px;
      height: 60px;
      background: #e056fd;
      border-radius: 10px 10px 0 0;
      box-shadow: inset 0 -10px 0 #be2edd;
    }

    .cake-top {
      position: absolute;
      bottom: 60px;
      width: 110px;
      left: 20px;
      height: 45px;
      background: #ff7979;
      border-radius: 10px 10px 0 0;
      box-shadow: inset 0 -8px 0 #badc58;
    }

    .candle {
      position: absolute;
      bottom: 105px;
      left: 68px;
      width: 14px;
      height: 35px;
      background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff3366 5px, #ff3366 10px);
      border-radius: 3px;
    }

    .flame {
      position: absolute;
      top: -18px;
      left: 1px;
      width: 12px;
      height: 18px;
      background: #ffbe76;
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 10px #ffbe76, 0 0 20px #ff0000;
      animation: flicker 0.6s infinite alternate;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(2deg); }
    }

    .flame.blown-out {
      display: none;
    }

    /* Music Player & Vinyl */
    #step-playlist {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease-out;
      width: 100%;
    }

    #step-playlist.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .vinyl-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      position: relative;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #333 20%, #111 21%, #111 30%, #222 31%, #111 60%, #000 61%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
    }

    .vinyl-label {
      width: 40px;
      height: 40px;
      background: #ff3366;
      border-radius: 50%;
      border: 3px solid #111;
    }

    .spinning {
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 15px 0;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .song-list {
      list-style: none;
      text-align: left;
      margin-top: 15px;
    }

    .song-item {
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .song-item:hover, .song-item.active-song {
      background: rgba(255, 51, 102, 0.3);
    }
  </style>
</head>
<body>

  <!-- Hanging Lights -->
  <div id="lights-strip">
    <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
    <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
    <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
  </div>

  <!-- Corner Back Button -->
  <button id="corner-back-btn" class="hidden" onclick="handleCornerBack()">
    <i class="fa-solid fa-arrow-left"></i> Back
  </button>

  <div class="container">

    <!-- Step 1: Input Name -->
    <div id="step-name" class="card">
      <h2>Who are we celebrating today? 🎉</h2>
      <input type="text" id="name-input" placeholder="Enter name..." />
      <br />
      <button class="btn" onclick="submitName()">Continue</button>
    </div>

    <!-- Step 2: Typewriter Greetings -->
    <div id="step-greeting" class="card hidden">
      <div id="typewriter"></div>
      <button class="btn" onclick="goToLightsStep()">Next ✨</button>
    </div>

    <!-- Step 3: Turn on Lights Prompt -->
    <div id="step-lights" class="card hidden">
      <h2>Let's set the party mood! 🎈</h2>
      <button class="btn" onclick="turnOnPartyLights()">Turn On Lights 💡</button>
    </div>

    <!-- Step 4: Main Celebration Header & Cake -->
    <div id="step-main" class="card hidden">
      <h1 id="welcome-header">Happy Birthday!</h1>
      
      <div class="cake-container">
        <div class="candle">
          <div class="flame"></div>
        </div>
        <div class="cake-top"></div>
        <div class="cake-base"></div>
      </div>

      <p style="margin-bottom: 15px;">Make a wish and blow out the candle!</p>
      <button id="blow-btn" class="btn" onclick="blowCandles()">Blow Candle 🎂</button>
    </div>

    <!-- Step 5: Music Playlist -->
    <div id="step-playlist" class="card hidden">
      <h3>Birthday Tunes 🎵</h3>

      <!-- Audio Element -->
      <audio id="audio-player"></audio>

      <div class="vinyl-wrapper" style="margin-top: 15px;">
        <div id="vinyl-disc" class="vinyl">
          <div class="vinyl-label"></div>
        </div>
      </div>

      <p id="track-name" style="font-weight: bold; font-size: 0.9rem; color: #ffcc00;">
        Select a Track
      </p>

      <div class="player-controls">
        <button class="control-btn" onclick="prevTrack()"><i class="fa-solid fa-backward"></i></button>
        <button class="control-btn" id="play-toggle-btn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
        <button class="control-btn" onclick="nextTrack()"><i class="fa-solid fa-forward"></i></button>
      </div>

      <ul class="song-list" id="playlist-ul"></ul>
    </div>

  </div>

  <script>
    /* GLOBAL STATE */
    let userName = "Friend";
    let currentStep = 1;
    let candlesBlown = false;
    let isPlaying = false;
    let currentTrackIdx = 0;

    /* Typewriter configuration */
    const greetings = [
      "Happy Birthday!",
      "¡Feliz Cumpleaños!",
      "Joyeux Anniversaire!",
      "Alles Gute zum Geburtstag!",
      "Selamat Ulang Tahun!",
      "Janmadin ki Shubhkamnayein!"
    ];
    let langIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    let typewriterTimeout = null;

    /* Playlist Data */
    const playlist = [
      { 
        title: "Happy Birthday (Acoustic)", 
        artist: "Celebration Beats", 
        url: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a82a0b.mp3?filename=happy-birthday-15285.mp3" 
      },
      { 
        title: "Party Pop Instrumental", 
        artist: "Festive Vibe", 
        url: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=party-upbeat-18333.mp3" 
      },
      { 
        title: "Chill Celebration", 
        artist: "Lofi Beats", 
        url: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" 
      }
    ];

    const audioPlayer = document.getElementById("audio-player");

    // Populate track items on load
    window.onload = function() {
      const ul = document.getElementById("playlist-ul");
      playlist.forEach((track, idx) => {
        const li = document.createElement("li");
        li.className = "song-item";
        li.innerHTML = `<span>${track.title}</span> <small>${track.artist}</small>`;
        li.onclick = () => selectTrack(idx);
        ul.appendChild(li);
      });
    };

    /* NAVIGATION LOGIC */
    function submitName() {
      const val = document.getElementById("name-input").value.trim();
      if (val) userName = val;

      currentStep = 2;
      document.getElementById("step-name").classList.add("hidden");
      document.getElementById("step-greeting").classList.remove("hidden");
      document.getElementById("corner-back-btn").classList.remove("hidden");

      typewriterLoop();
    }

    function typewriterLoop() {
      const currentFullText = greetings[langIndex];
      const typewriterEl = document.getElementById("typewriter");

      if (isDeleting) {
        charIndex--;
        typewriterEl.innerText = currentFullText.substring(0, charIndex);
      } else {
        charIndex++;
        typewriterEl.innerText = currentFullText.substring(0, charIndex);
      }

      let speed = isDeleting ? 50 : 100;

      if (!isDeleting && charIndex === currentFullText.length) {
        speed = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        langIndex = (langIndex + 1) % greetings.length;
        speed = 400;
      }

      typewriterTimeout = setTimeout(typewriterLoop, speed);
    }

    function goToLightsStep() {
      clearTimeout(typewriterTimeout);
      currentStep = 3;
      document.getElementById("step-greeting").classList.add("hidden");
      document.getElementById("step-lights").classList.remove("hidden");
    }

    function turnOnPartyLights() {
      confetti({ 
        particleCount: 50, 
        spread: 80, 
        origin: { y: 0.5 } 
      });

      setTimeout(() => {
        currentStep = 4;
        document.getElementById("step-lights").classList.add("hidden");
        document.getElementById("step-main").classList.remove("hidden");
        document.getElementById("welcome-header").innerText = `Happy Birthday, ${userName}!`;
      }, 600);
    }

    function blowCandles() {
      if (candlesBlown) return;

      const flames = document.querySelectorAll(".flame");
      flames.forEach(flame => flame.classList.add("blown-out"));

      candlesBlown = true;
      document.getElementById("blow-btn").innerText = "Wish Granted! ✨";
      document.getElementById("blow-btn").style.opacity = "0.7";

      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 },
        colors: ['#ff3344', '#ffffff', '#ffcc00', '#ff8800']
      });

      setTimeout(() => {
        document.getElementById("step-playlist").classList.remove("hidden");
      }, 800);
    }

    function handleCornerBack() {
      if (currentStep === 2) {
        clearTimeout(typewriterTimeout);
        currentStep = 1;
        document.getElementById("step-greeting").classList.add("hidden");
        document.getElementById("step-name").classList.remove("hidden");
        document.getElementById("corner-back-btn").classList.add("hidden");
      } else if (currentStep === 3) {
        currentStep = 2;
        document.getElementById("step-lights").classList.add("hidden");
        document.getElementById("step-greeting").classList.remove("hidden");
        langIndex = 0;
        charIndex = 0;
        isDeleting = false;
        clearTimeout(typewriterTimeout);
        typewriterLoop();
      } else if (currentStep === 4) {
        currentStep = 3;
        document.getElementById("step-main").classList.add("hidden");
        document.getElementById("step-playlist").classList.add("hidden");
        document.getElementById("step-lights").classList.remove("hidden");
      }
    }

    /* MUSIC PLAYER CONTROLS */
    function togglePlay() {
      const vinylDisc = document.getElementById("vinyl-disc");
      const playIcon = document.querySelector("#play-toggle-btn i");

      if (!audioPlayer.src) {
        selectTrack(0);
        return;
      }

      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
        vinylDisc.classList.remove("spinning");
        playIcon.className = "fa-solid fa-play";
      } else {
        audioPlayer.play();
        isPlaying = true;
        vinylDisc.classList.add("spinning");
        playIcon.className = "fa-solid fa-pause";
      }
    }

    function selectTrack(index) {
      currentTrackIdx = index;
      const track = playlist[currentTrackIdx];
      
      audioPlayer.src = track.url;
      audioPlayer.play();
      isPlaying = true;

      document.getElementById("vinyl-disc").classList.add("spinning");
      document.querySelector("#play-toggle-btn i").className = "fa-solid fa-pause";

      updatePlayerUI();
    }

    function prevTrack() {
      currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length;
      selectTrack(currentTrackIdx);
    }

    function nextTrack() {
      currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
      selectTrack(currentTrackIdx);
    }

    function updatePlayerUI() {
      const track = playlist[currentTrackIdx];
      document.getElementById("track-name").innerText = `${track.title} - ${track.artist}`;

      const songItems = document.querySelectorAll(".song-item");
      songItems.forEach((item, idx) => {
        if (idx === currentTrackIdx) {
          item.classList.add("active-song");
        } else {
          item.classList.remove("active-song");
        }
      });
    }

    audioPlayer.addEventListener("ended", () => {
      nextTrack();
    });

    /* SCROLL REVEAL OBSERVER */
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          document.getElementById("step-playlist").classList.add("revealed");
        }
      });
    }, { threshold: 0.2 });

    observer.observe(document.getElementById("step-playlist"));

    window.addEventListener("scroll", () => {
      const lightsStrip = document.getElementById("lights-strip");
      if (window.scrollY > 300) {
        lightsStrip.classList.add("scrolled-hidden");
      } else {
        lightsStrip.classList.remove("scrolled-hidden");
      }
    });
  </script>
</body>
</html>
