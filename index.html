<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none !important;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: #000000;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* Custom Red / Ink Black Cursor Dot */
    .custom-cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999999;
      transform: translate(-50%, -50%);
      background: #ff3344;
      box-shadow: 0 0 20px rgba(255, 51, 68, 0.9);
      transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease-out;
      will-change: transform, left, top;
    }

    .custom-cursor-dot.dark-mode {
      background: #000000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.95);
    }

    /* LAYER 1: Underneath Oppositional Gradient */
    .bg-gradient-underneath {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #e60026 0%, #7a0010 40%, #200004 70%, #000000 100%);
      z-index: 0;
    }

    /* LAYER 2: Canvas Mask Top Gradient */
    #fluid-mask-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Ambient Overlay */
    .ambient-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(255, 120, 50, 0.2) 0%, rgba(0, 0, 0, 0.85) 85%);
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    body.lights-active .ambient-overlay {
      opacity: 1;
    }

    /* BLOOMING SUNFLOWERS CONTAINER FOR STEP 1 */
    .sunflowers-bloom-wrapper {
      width: 100%;
      max-width: 500px;
      height: 90px;
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      position: relative;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .sunflowers-bloom-wrapper.fade-out {
      opacity: 0;
    }

    /* Aesthetic Mini Sunflower Element */
    .mini-sunflower {
      width: 42px;
      height: 42px;
      opacity: 0;
      transform: scale(0) rotate(-45deg);
      animation: bloomIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      filter: drop-shadow(0 0 10px rgba(255, 191, 0, 0.6));
    }

    .mini-sunflower:nth-child(1) { animation-delay: 0.2s; }
    .mini-sunflower:nth-child(2) { animation-delay: 0.4s; }
    .mini-sunflower:nth-child(3) { animation-delay: 0.6s; }
    .mini-sunflower:nth-child(4) { animation-delay: 0.8s; }
    .mini-sunflower:nth-child(5) { animation-delay: 1.0s; }
    .mini-sunflower:nth-child(6) { animation-delay: 1.2s; }

    @keyframes bloomIn {
      0% { opacity: 0; transform: scale(0) rotate(-60deg); }
      70% { opacity: 1; transform: scale(1.15) rotate(10deg); }
      100% { opacity: 0.95; transform: scale(1) rotate(0deg); }
    }

    /* Festoon String Lights */
    .lights-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .lights-wrapper.on {
      opacity: 1;
      transform: translateY(0);
    }

    .lights-wrapper.scrolled-hidden {
      opacity: 0 !important;
      transform: translateY(-20px) !important;
    }

    .light-wire-main {
      display: flex;
      justify-content: space-around;
      width: 100%;
      border-top: 2px solid rgba(255, 180, 50, 0.7);
      padding-top: 2px;
    }

    .bulb-socket {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .socket {
      width: 8px;
      height: 6px;
      background: #333;
    }

    .bulb-gold {
      width: 15px;
      height: 24px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #ffb700 85%);
      box-shadow: 0 0 18px #ffcc00, 0 0 38px #ff8800;
      animation: warmGlow 1.8s infinite alternate ease-in-out;
    }

    @keyframes warmGlow {
      0% { opacity: 0.7; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 28px #ffe066, 0 0 50px #ff8800; }
    }

    /* Navigation Button */
    .btn-corner-back {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 110;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .btn-corner-back:hover {
      background: rgba(255, 77, 77, 0.4);
      border-color: #ff4d4d;
    }

    /* Page Sections */
    .fullpage-section {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    /* Scroll Prompt Indicator */
    .scroll-hint-prompt {
      margin-top: 2rem;
      font-size: 0.95rem;
      color: #ffc2c6;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: bouncePrompt 2s infinite ease-in-out;
      opacity: 0.9;
    }

    @keyframes bouncePrompt {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* Typography & Inputs */
    h2 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    .input-field {
      width: 100%;
      max-width: 340px;
      padding: 14px 24px;
      font-size: 1.1rem;
      font-family: inherit;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      text-align: center;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #ff4d5a;
      box-shadow: 0 0 25px rgba(255, 77, 90, 0.7);
    }

    .btn-glow {
      margin-top: 1.8rem;
      padding: 14px 38px;
      font-size: 1.05rem;
      font-family: inherit;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #a3000f, #570008);
      border: 1px solid rgba(255, 120, 120, 0.5);
      border-radius: 35px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8), 0 0 20px rgba(220, 0, 30, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-glow:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #c40012, #7a000b);
      box-shadow: 0 0 30px rgba(255, 50, 70, 0.9);
    }

    .greeting-container {
      text-align: center;
    }

    .hb-glow-text {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
      min-height: 80px;
    }

    .fixed-name {
      font-family: 'Playfair Display', serif;
      font-size: 4.8rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 25px #ff3344, 0 0 60px rgba(255, 0, 40, 0.9);
      margin-bottom: 2.5rem;
    }

    .cursor {
      display: inline-block;
      width: 4px;
      height: 2.6rem;
      background-color: #ffffff;
      margin-left: 6px;
      box-shadow: 0 0 12px #ffffff;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Cake Elements */
    .cake-container {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 10px auto;
    }

    .cake {
      width: 100%;
      height: 100%;
    }

    .flame {
      fill: #ff9d00;
      filter: drop-shadow(0 0 10px #ff4500) drop-shadow(0 0 20px #ffd700);
      transform-origin: center bottom;
      animation: flicker 0.6s ease-in-out infinite alternate;
      transition: opacity 0.5s ease;
      opacity: 1;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.12) rotate(2deg); }
    }

    .flame.blown-out {
      opacity: 0 !important;
      animation: none !important;
    }

    .wish-text {
      font-size: 1.2rem;
      color: #ffb3b8;
      margin-top: 10px;
      text-align: center;
    }

    /* Music Player Layout */
    .music-section-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .music-taste-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 0 25px rgba(255, 77, 90, 0.8);
    }

    .music-dual-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      margin-top: 1rem;
    }

    /* Vinyl Player */
    .vinyl-player-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(-70px);
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.9s ease;
    }

    .album-display {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .album-cover {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle at 35% 35%, #a80e1a, #4a0006);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.95), inset 0 0 35px rgba(0, 0, 0, 0.7);
      border-radius: 4px;
      position: absolute;
      left: 0;
      top: 10px;
      z-index: 3;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .vinyl-record {
      width: 270px;
      height: 270px;
      position: absolute;
      right: -70px;
      top: 15px;
      z-index: 2;
      border-radius: 50%;
      background: #0d0d0d;
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.9);
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .vinyl-record.spinning {
      animation: spinVinyl 4s linear infinite;
      right: -90px;
    }

    @keyframes spinVinyl {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .audio-player-controls {
      width: 100%;
      max-width: 380px;
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .track-title {
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: #ffb3b8;
      letter-spacing: 1px;
      text-align: center;
    }

    /* GLOWING TIMELINE & PROGRESS BAR */
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      position: relative;
      overflow: visible;
      cursor: pointer !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff1a40, #ff5266, #ff7082);
      border-radius: 4px;
      position: relative;
      transition: width 0.1s linear;
    }

    /* Dynamic Glow effect on playing */
    .progress-bar-wrap.is-playing .progress-bar-fill {
      box-shadow: 0 0 12px #ff3344, 0 0 24px rgba(255, 51, 68, 0.8);
      animation: timelinePulse 1.8s infinite alternate ease-in-out;
    }

    @keyframes timelinePulse {
      0% {
        box-shadow: 0 0 10px #ff1a40, 0 0 20px rgba(255, 26, 64, 0.6);
      }
      100% {
        box-shadow: 0 0 18px #ff4d66, 0 0 35px rgba(255, 77, 102, 0.95);
      }
    }

    /* Glow Head Dot at timeline tip */
    .progress-glow-head {
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff, 0 0 20px #ff3344, 0 0 30px #ff3344;
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .progress-bar-wrap.is-playing .progress-glow-head {
      transform: translateY(-50%) scale(1);
    }

    .time-indicators {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: -2px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 6px;
    }

    .player-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 1.2rem;
      transition: all 0.2s ease;
    }

    .player-btn:hover {
      color: #ff4d5a;
      transform: scale(1.15);
    }

    .player-btn.play-btn-large {
      width: 50px;
      height: 50px;
      background: #ff4d5a;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 0 25px rgba(255, 77, 90, 0.8);
    }

    /* Playlist Container */
    .playlist-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: rgba(25, 0, 5, 0.65);
      border: 1px solid rgba(255, 77, 90, 0.3);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      transform: translateX(70px);
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.9s ease;
    }

    .playlist-title {
      font-family: 'Space Mono', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: #ff4d5a;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .song-list {
      width: 100%;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      transition: all 0.3s ease;
      width: 100%;
    }

    .song-item:hover, .song-item.active-song {
      background: rgba(255, 77, 90, 0.22);
      border-color: rgba(255, 77, 90, 0.6);
      transform: translateX(6px);
    }

    .song-info {
      display: flex;
      flex-direction: column;
    }

    .song-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #ffffff;
    }

    .song-artist {
      font-size: 0.8rem;
      color: #ffb3b8;
    }

    .play-icon-small {
      color: #ff4d5a;
      font-size: 0.9rem;
    }

    /* Scroll Reveal State */
    .music-dual-container.revealed .vinyl-player-left {
      transform: translateX(0);
      opacity: 1;
    }

    .music-dual-container.revealed .playlist-right {
      transform: translateX(0);
      opacity: 1;
    }

    @media (max-width: 850px) {
      .music-dual-container {
        flex-direction: column;
        align-items: center;
      }
      .playlist-right {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- LAYER 1: Underneath Oppositional Gradient -->
  <div class="bg-gradient-underneath"></div>

  <!-- LAYER 2: Canvas Mask Top Gradient Layer -->
  <canvas id="fluid-mask-canvas"></canvas>

  <!-- Dynamic Red / Ink Black Cursor Dot -->
  <div id="dot-cursor" class="custom-cursor-dot"></div>

  <!-- Ambient Light Overlay -->
  <div class="ambient-overlay"></div>

  <!-- Festive String Lights -->
  <div id="lights-strip" class="lights-wrapper">
    <div class="light-wire-main">
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
    </div>
  </div>

  <!-- Back Button -->
  <button id="corner-back-btn" class="btn-corner-back hidden" onclick="handleCornerBack()">
    <i class="fa-solid fa-arrow-left"></i> Back
  </button>

  <!-- STEP 1: Enter Name & Blooming Sunflowers -->
  <section id="step-name" class="fullpage-section">
    <h2>Who is the birthday star? 👑</h2>
    <input type="text" id="user-name-input" class="input-field" placeholder="Enter name..." autocomplete="off" onkeydown="handleKeyPress(event)">
    
    <!-- Blooming Aesthetic Sunflowers -->
    <div id="sunflowers-garden" class="sunflowers-bloom-wrapper">
      <svg class="mini-sunflower" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="16" fill="#3b1d0e"/>
        <g fill="#ffc107">
          <ellipse cx="50" cy="18" rx="7" ry="16"/>
          <ellipse cx="50" cy="82" rx="7" ry="16"/>
          <ellipse cx="18" cy="50" rx="16" ry="7"/>
          <ellipse cx="82" cy="50" rx="16" ry="7"/>
          <ellipse cx="27" cy="27" rx="7" ry="16" transform="rotate(-45 27 27)"/>
          <ellipse cx="73" cy="73" rx="7" ry="16" transform="rotate(-45 73 73)"/>
          <ellipse cx="27" cy="73" rx="7" ry="16" transform="rotate(45 27 73)"/>
          <ellipse cx="73" cy="27" rx="7" ry="16" transform="rotate(45 73 27)"/>
        </g>
      </svg>
      <svg class="mini-sunflower" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="16" fill="#3b1d0e"/>
        <g fill="#ffb300">
          <ellipse cx="50" cy="18" rx="7" ry="16"/>
          <ellipse cx="50" cy="82" rx="7" ry="16"/>
          <ellipse cx="18" cy="50" rx="16" ry="7"/>
          <ellipse cx="82" cy="50" rx="16" ry="7"/>
          <ellipse cx="27" cy="27" rx="7" ry="16" transform="rotate(-45 27 27)"/>
          <ellipse cx="73" cy="73" rx="7" ry="16" transform="rotate(-45 73 73)"/>
          <ellipse cx="27" cy="73" rx="7" ry="16" transform="rotate(45 27 73)"/>
          <ellipse cx="73" cy="27" rx="7" ry="16" transform="rotate(45 73 27)"/>
        </g>
      </svg>
      <svg class="mini-sunflower" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="16" fill="#3b1d0e"/>
        <g fill="#ffc107">
          <ellipse cx="50" cy="18" rx="7" ry="16"/>
          <ellipse cx="50" cy="82" rx="7" ry="16"/>
          <ellipse cx="18" cy="50" rx="16" ry="7"/>
          <ellipse cx="82" cy="50" rx="16" ry="7"/>
          <ellipse cx="27" cy="27" rx="7" ry="16" transform="rotate(-45 27 27)"/>
          <ellipse cx="73" cy="73" rx="7" ry="16" transform="rotate(-45 73 73)"/>
          <ellipse cx="27" cy="73" rx="7" ry="16" transform="rotate(45 27 73)"/>
          <ellipse cx="73" cy="27" rx="7" ry="16" transform="rotate(45 73 27)"/>
        </g>
      </svg>
      <svg class="mini-sunflower" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="16" fill="#3b1d0e"/>
        <g fill="#ffb300">
          <ellipse cx="50" cy="18" rx="7" ry="16"/>

  <script>
    /* CURSOR DOT SETUP */
    const dotCursor = document.getElementById('dot-cursor');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      const elem = document.elementFromPoint(e.clientX, e.clientY);
      if (elem) {
        const tag = elem.tagName.toLowerCase();
        if (tag === 'input' || tag === 'button' || elem.classList.contains('playlist-right') || tag === 'h1') {
          dotCursor.classList.add('dark-mode');
        } else {
          dotCursor.classList.remove('dark-mode');
        }
      }
    });

    function renderCursor() {
      cursorX += (mouseX - cursorX) * 0.22;
      cursorY += (mouseY - cursorY) * 0.22;
      dotCursor.style.left = `${cursorX}px`;
      dotCursor.style.top = `${cursorY}px`;
      requestAnimationFrame(renderCursor);
    }
    renderCursor();

    /* SHAPELESS FLOWING ORGANIC LIQUID MASK ENGINE */
    const canvas = document.getElementById('fluid-mask-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawTopGradientLayer();
    }

    function drawTopGradientLayer() {
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#000000');
      grad.addColorStop(0.3, '#1f0004');
      grad.addColorStop(0.7, '#6b000d');
      grad.addColorStop(1, '#e60026');

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const NUM_NODES = 12;
    let fluidNodes = [];

    for (let i = 0; i < NUM_NODES; i++) {
      fluidNodes.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        radius: Math.random() * 180 + 120,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function updateFluidMask() {
      drawTopGradientLayer();

      ctx.globalCompositeOperation = 'destination-out';

      fluidNodes.forEach(node => {
        node.x += node.vx;
        node.y += node.vy;

        if (node.x < -100) node.x = window.innerWidth + 100;
        if (node.x > window.innerWidth + 100) node.x = -100;
        if (node.y < -100) node.y = window.innerHeight + 100;
        if (node.y > window.innerHeight + 100) node.y = -100;

        node.pulse += 0.02;
        const currentRadius = node.radius + Math.sin(node.pulse) * 35;

        const radialGrad = ctx.createRadialGradient(
          node.x, node.y, 0,
          node.x, node.y, currentRadius
        );
        radialGrad.addColorStop(0, 'rgba(0,0,0,1)');
        radialGrad.addColorStop(0.6, 'rgba(0,0,0,0.8)');
        radialGrad.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = radialGrad;
        ctx.beginPath();
        ctx.arc(node.x, node.y, currentRadius, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(updateFluidMask);
    }
    updateFluidMask();

    /* APP FLOW AND AUDIO PLAYER SYSTEM */
    let userName = "";
    let currentStep = 1;

    const songs = [
      { name: "Khat", artist: "Navjot Ahuja", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { name: "Night Changes", artist: "One Direction", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { name: "Soft Life", artist: "Aesthetic Vibes", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];

    let currentSongIndex = 0;
    const audioPlayer = new Audio();
    let isPlaying = false;

    // Elements
    const stepName = document.getElementById('step-name');
    const stepGreeting = document.getElementById('step-greeting');
    const stepLights = document.getElementById('step-lights');
    const stepMain = document.getElementById('step-main');
    const stepPlaylist = document.getElementById('step-playlist');
    const cornerBackBtn = document.getElementById('corner-back-btn');
    const lightsStrip = document.getElementById('lights-strip');

    const progressBarFill = document.getElementById('progress-bar-fill');
    const progressContainer = document.getElementById('progress-container');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');
    const playToggleBtn = document.getElementById('play-toggle-btn');
    const trackName = document.getElementById('track-name');
    const vinylDisc = document.getElementById('vinyl-disc');
    const songListItems = document.getElementById('song-list-items');

    function handleKeyPress(e) {
      if (e.key === 'Enter') startGreeting();
    }

    function updateBackBtnVisibility() {
      if (currentStep > 1) {
        cornerBackBtn.classList.remove('hidden');
      } else {
        cornerBackBtn.classList.add('hidden');
      }
    }

    function handleCornerBack() {
      if (currentStep === 2) {
        stepGreeting.classList.add('hidden');
        stepName.classList.remove('hidden');
        currentStep = 1;
      } else if (currentStep === 3) {
        stepLights.classList.add('hidden');
        stepGreeting.classList.remove('hidden');
        currentStep = 2;
      } else if (currentStep === 4) {
        stepMain.classList.add('hidden');
        stepLights.classList.remove('hidden');
        currentStep = 3;
      }
      updateBackBtnVisibility();
    }

    // Step 1 -> 2
    function startGreeting() {
      const input = document.getElementById('user-name-input').value.trim();
      userName = input || "Birthday Star";
      
      document.getElementById('user-name-display').textContent = userName;
      document.getElementById('welcome-header').textContent = `Happy Birthday, ${userName}! 🎉`;
      document.getElementById('music-taste-header').textContent = `${userName}'s Sound Track`;

      stepName.classList.add('hidden');
      stepGreeting.classList.remove('hidden');
      currentStep = 2;
      updateBackBtnVisibility();

      startMultilingualTypewriter();
    }

    // Multilingual Typewriter
    const greetings = ["Happy Birthday", "Jan जन्मदिन Mubarak", "Joyeux Anniversaire", "Feliz Cumpleaños", "Alles Gute zum Geburtstag"];
    let greetingIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function startMultilingualTypewriter() {
      const target = document.getElementById('typewriter-text');
      const currentGreeting = greetings[greetingIndex];

      if (isDeleting) {
        target.textContent = currentGreeting.substring(0, charIndex - 1);
        charIndex--;
      } else {
        target.textContent = currentGreeting.substring(0, charIndex + 1);
        charIndex++;
      }

      let speed = isDeleting ? 40 : 80;

      if (!isDeleting && charIndex === currentGreeting.length) {
        speed = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        greetingIndex = (greetingIndex + 1) % greetings.length;
        speed = 400;
      }

      if (currentStep === 2) {
        setTimeout(startMultilingualTypewriter, speed);
      }
    }

    // Step 2 -> 3
    function goToLightsStep() {
      stepGreeting.classList.add('hidden');
      stepLights.classList.remove('hidden');
      currentStep = 3;
      updateBackBtnVisibility();
    }

    // Step 3 -> 4
    function turnOnLightsAndShowCake() {
      lightsStrip.classList.add('on');
      document.body.classList.add('lights-active');

      stepLights.classList.add('hidden');
      stepMain.classList.remove('hidden');
      stepPlaylist.classList.remove('hidden');
      currentStep = 4;
      updateBackBtnVisibility();

      initPlaylist();
      loadTrack(0);
    }

    // Candle Blowing Logic
    function blowCandles() {
      document.querySelectorAll('.flame').forEach(f => f.classList.add('blown-out'));
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // Scroll reveal music section animation
    window.addEventListener('scroll', () => {
      const dualContainer = document.getElementById('music-dual-container');
      if (!dualContainer) return;

      const rect = dualContainer.getBoundingClientRect();
      if (rect.top < window.innerHeight * 0.85) {
        dualContainer.classList.add('revealed');
      }

      if (window.scrollY > 100) {
        lightsStrip.classList.add('scrolled-hidden');
      } else {
        lightsStrip.classList.remove('scrolled-hidden');
      }
    });

    /* AUDIO ENGINE INTEGRATION */
    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function initPlaylist() {
      songListItems.innerHTML = "";
      songs.forEach((song, idx) => {
        const li = document.createElement('li');
        li.className = `song-item ${idx === currentSongIndex ? 'active-song' : ''}`;
        li.onclick = () => selectSong(idx);
        li.innerHTML = `
          <div class="song-info">
            <span class="song-name">${song.name}</span>
            <span class="song-artist">${song.artist}</span>
          </div>
          <i class="fa-solid ${idx === currentSongIndex && isPlaying ? 'fa-pause' : 'fa-play'} play-icon-small"></i>
        `;
        songListItems.appendChild(li);
      });
    }

    function loadTrack(index) {
      currentSongIndex = index;
      const song = songs[index];
      trackName.textContent = `${song.name} - ${song.artist}`;
      audioPlayer.src = song.src;
      initPlaylist();
    }

    function togglePlay() {
      if (!audioPlayer.src) loadTrack(currentSongIndex);

      if (isPlaying) {
        audioPlayer.pause();
      } else {
        audioPlayer.play();
      }
    }

    audioPlayer.addEventListener('play', () => {
      isPlaying = true;
      playToggleBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      vinylDisc.classList.add('spinning');
      progressContainer.classList.add('is-playing');
      initPlaylist();
    });

    audioPlayer.addEventListener('pause', () => {
      isPlaying = false;
      playToggleBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
      vinylDisc.classList.remove('spinning');
      progressContainer.classList.remove('is-playing');
      initPlaylist();
    });

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressBarFill.style.width = `${pct}%`;
        timeCurrent.textContent = formatTime(audioPlayer.currentTime);
        timeDuration.textContent = formatTime(audioPlayer.duration);
      }
    });

    audioPlayer.addEventListener('ended', () => {
      nextTrack();
    });

    function seekTrack(e) {
      const rect = progressContainer.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      if (audioPlayer.duration) {
        audioPlayer.currentTime = (clickX / width) * audioPlayer.duration;
      }
    }

    function prevTrack() {
      currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
      loadTrack(currentSongIndex);
      audioPlayer.play();
    }

    function nextTrack() {
      currentSongIndex = (currentSongIndex + 1) % songs.length;
      loadTrack(currentSongIndex);
      audioPlayer.play();
    }

    function selectSong(index) {
      if (currentSongIndex === index) {
        togglePlay();
      } else {
        loadTrack(index);
        audioPlayer.play();
      }
    }
  </script>
