<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=Outfit:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none !important; /* Custom blob cursor used */
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: linear-gradient(135deg, #050000 0%, #2b0003 40%, #4d0008 70%, #100002 100%);
      background-size: 300% 300%;
      animation: ambientGradient 16s ease infinite;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* Grain / Texture Noise Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.9;
    }

    @keyframes ambientGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Custom Juicy Blob Cursor */
    .cursor-blob {
      position: fixed;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      background: #000000;
      border: 1px solid rgba(255, 77, 77, 0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(180, 0, 20, 0.4);
      transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  height 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  background 0.3s ease, 
                  border 0.3s ease;
    }

    .cursor-blob.hovered {
      width: 48px;
      height: 48px;
      background: rgba(180, 0, 20, 0.85);
      border: 1.5px solid #ff4d5a;
      box-shadow: 0 0 30px rgba(255, 77, 90, 0.8);
    }

    /* Floating background embers */
    .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      background: rgba(255, 50, 60, 0.4);
      box-shadow: 0 0 12px rgba(255, 0, 20, 0.6);
      border-radius: 50%;
      animation: floatUp 9s linear infinite;
    }

    .particle:nth-child(1) { left: 12%; width: 12px; height: 12px; animation-duration: 8s; }
    .particle:nth-child(2) { left: 35%; width: 18px; height: 18px; animation-duration: 11s; animation-delay: 1s; }
    .particle:nth-child(3) { left: 58%; width: 8px; height: 8px; animation-duration: 7s; animation-delay: 2s; }
    .particle:nth-child(4) { left: 78%; width: 15px; height: 15px; animation-duration: 10s; animation-delay: 0.5s; }
    .particle:nth-child(5) { left: 90%; width: 10px; height: 10px; animation-duration: 9s; animation-delay: 3s; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
    }

    /* Ambient Spotlight */
    .ambient-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(255, 120, 50, 0.18) 0%, rgba(0, 0, 0, 0.92) 80%);
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    body.lights-active .ambient-overlay {
      opacity: 1;
    }

    /* Festoon String Lights */
    .lights-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 1.5s ease, transform 1.2s ease-out;
    }

    .lights-wrapper.on {
      opacity: 1;
      transform: translateY(0);
    }

    .light-wire-main {
      display: flex;
      justify-content: space-around;
      width: 100%;
      border-top: 2px solid rgba(200, 140, 40, 0.5);
      padding-top: 2px;
    }

    .bulb-socket {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .socket {
      width: 8px;
      height: 6px;
      background: #333;
    }

    .bulb-gold {
      width: 15px;
      height: 24px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #ffb700 85%);
      box-shadow: 0 0 15px #ffcc00, 0 0 35px #ff8800;
      animation: warmGlow 1.8s infinite alternate ease-in-out;
    }

    @keyframes warmGlow {
      0% { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.08); box-shadow: 0 0 25px #ffe066, 0 0 45px #ff8800; }
    }

    /* Back Button */
    .btn-corner-back {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 110;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .btn-corner-back:hover {
      background: rgba(255, 77, 77, 0.3);
      border-color: #ff4d4d;
    }

    /* Full Page Scroll Section Container */
    .fullpage-section {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    /* Typography & Buttons */
    h2 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    .input-field {
      width: 100%;
      max-width: 340px;
      padding: 14px 24px;
      font-size: 1.1rem;
      font-family: inherit;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      text-align: center;
      outline: none;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #ff4d5a;
      box-shadow: 0 0 20px rgba(255, 77, 90, 0.5);
    }

    .btn-glow {
      margin-top: 1.8rem;
      padding: 14px 38px;
      font-size: 1.05rem;
      font-family: inherit;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #80000a, #4a0006);
      border: 1px solid rgba(255, 100, 100, 0.4);
      border-radius: 35px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(180, 0, 20, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-glow:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #a8000e, #660009);
      box-shadow: 0 0 25px rgba(255, 50, 70, 0.8);
    }

    /* Step 2 Typewriter */
    .greeting-container {
      text-align: center;
    }

    .hb-glow-text {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      min-height: 80px;
    }

    .fixed-name {
      font-family: 'Playfair Display', serif;
      font-size: 4.8rem;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      text-shadow: 0 0 20px #ff3344, 0 0 50px rgba(255, 0, 40, 0.8);
      margin-bottom: 2.5rem;
    }

    .cursor {
      display: inline-block;
      width: 4px;
      height: 2.6rem;
      background-color: #ffffff;
      margin-left: 6px;
      box-shadow: 0 0 10px #ffffff;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Cake SVG Container */
    .cake-container {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 10px auto;
    }

    .cake {
      width: 100%;
      height: 100%;
    }

    .flame {
      fill: #ff9d00;
      filter: drop-shadow(0 0 8px #ff4500) drop-shadow(0 0 15px #ffd700);
      transform-origin: center bottom;
      animation: flicker 0.6s ease-in-out infinite alternate;
      transition: opacity 0.5s ease;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(2deg); }
    }

    .flame.blown-out {
      opacity: 0;
      animation: none;
    }

    .wish-text {
      font-size: 1.2rem;
      color: #ffb3b8;
      margin-top: 10px;
      font-style: italic;
      text-align: center;
    }

    /* --- BEACH HOUSE VINYL PLAYER (DEPRESSION CHERRY STYLE) --- */
    .vinyl-player-section {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .album-display {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    /* Depression Cherry Velvet-Style Jacket Cover */
    .album-cover {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle at 30% 30%, #8a0b14, #420005);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      position: absolute;
      left: 0;
      top: 10px;
      z-index: 3;
      padding: 25px;
      display: flex;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cover-text {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: rgba(255, 220, 220, 0.85);
      text-transform: lowercase;
    }

    /* Floral Painted Vinyl Record */
    .vinyl-record {
      width: 290px;
      height: 290px;
      position: absolute;
      right: -80px;
      top: 15px;
      z-index: 2;
      border-radius: 50%;
      background: #0d0d0d;
      box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8);
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG Floral Disc Paint Artwork */
    .vinyl-svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    /* Spin Animation */
    .vinyl-record.spinning {
      animation: spinVinyl 4s linear infinite;
      right: -100px;
    }

    @keyframes spinVinyl {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Vinyl Controls & Bar */
    .audio-player-controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .track-title {
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem;
      color: #ffb3b8;
      letter-spacing: 1px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-bar-fill {
      width: 30%;
      height: 100%;
      background: #ff4d5a;
      box-shadow: 0 0 10px #ff4d5a;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 8px;
    }

    .player-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 1.2rem;
      transition: all 0.2s ease;
    }

    .player-btn:hover {
      color: #ff4d5a;
      transform: scale(1.15);
    }

    .player-btn.play-btn-large {
      width: 52px;
      height: 52px;
      background: #ff4d5a;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 0 20px rgba(255, 77, 90, 0.6);
    }

    .player-btn.play-btn-large:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(255, 77, 90, 0.9);
    }

    @media (max-width: 600px) {
      .album-display {
        transform: scale(0.85);
      }
      .fixed-name {
        font-size: 3.2rem;
      }
      .hb-glow-text {
        font-size: 2.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Juicy Following Blob Cursor -->
  <div id="blob-cursor" class="cursor-blob"></div>

  <!-- Ambient Darkening Overlay -->
  <div class="ambient-overlay"></div>

  <!-- FESTOON CELEBRATION LIGHT STRIPS -->
  <div id="lights-strip" class="lights-wrapper">
    <div class="light-wire-main">
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
      <div class="bulb-socket"><div class="socket"></div><div class="bulb-gold"></div></div>
    </div>
  </div>

  <!-- Background Particles -->
  <div class="particle-container">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Back Button -->
  <button id="corner-back-btn" class="btn-corner-back hidden" onclick="handleCornerBack()">
    <i class="fa-solid fa-arrow-left"></i> Back
  </button>

  <!-- STEP 1: Enter Name -->
  <section id="step-name" class="fullpage-section">
    <h2>Who is the birthday star? 👑</h2>
    <input type="text" id="user-name-input" class="input-field" placeholder="Enter name..." autocomplete="off" onkeydown="handleKeyPress(event)">
    <button class="btn-glow" onclick="startGreeting()">Celebrate 🎉</button>
  </section>

  <!-- STEP 2: Multilingual Typewriter -->
  <section id="step-greeting" class="fullpage-section hidden">
    <div class="greeting-container">
      <h2 class="hb-glow-text">
        <span id="typewriter-text"></span><span class="cursor"></span>
      </h2>
      <h1 id="user-name-display" class="fixed-name"></h1>
      <button class="btn-glow" onclick="goToLightsStep()">Open Surprise 🎁</button>
    </div>
  </section>

  <!-- STEP 3: Lights Turn On Prompt -->
  <section id="step-lights" class="fullpage-section hidden">
    <h2>Set the Celebration Mood! ✨</h2>
    <p style="color: #ffb3b8; font-size: 1.15rem; margin-bottom: 1.5rem; text-align: center;">
      Tap below to illuminate the room before your cake arrives!
    </p>
    <button class="btn-glow" onclick="turnOnLightsAndShowCake()">Turn On Lights ✨</button>
  </section>

  <!-- STEP 4: Interactive Cake Page -->
  <section id="step-main" class="fullpage-section hidden">
    <h2 id="welcome-header" style="font-family: 'Playfair Display', serif; font-size: 3rem; font-style: italic; font-weight: 900; text-shadow: 0 0 25px #ff3344;"></h2>
    <p class="wish-text">Make a wish and blow out the candles! 🕯️</p>

    <!-- SVG Cake with ALL 3 CANDLES LIT -->
    <div class="cake-container" onclick="blowCandles()">
      <svg class="cake" viewBox="0 0 200 200">
        <ellipse cx="100" cy="170" rx="85" ry="18" fill="#1f0305" stroke="#4a0008" stroke-width="2"/>
        <ellipse cx="100" cy="168" rx="75" ry="14" fill="#380207"/>
        
        <path d="M 30 120 L 30 155 Q 100 180 170 155 L 170 120 Z" fill="#2b0005"/>
        <ellipse cx="100" cy="120" rx="70" ry="15" fill="#4d000a"/>
        
        <path d="M 30 120 Q 100 135 170 120 Q 170 110 170 100 Q 100 115 30 100 Z" fill="#ff3344"/>
        
        <path d="M 35 75 L 35 105 Q 100 125 165 105 L 165 75 Z" fill="#2b0005"/>
        <ellipse cx="100" cy="75" rx="65" ry="14" fill="#80000e"/>

        <path d="M 35 75 Q 45 90 55 75 Q 65 95 75 75 Q 85 90 95 75 Q 105 95 115 75 Q 125 90 135 75 Q 145 95 155 75 Q 165 85 165 75 Z" fill="#ffffff"/>

        <!-- Candle 1 -->
        <rect x="65" y="45" width="8" height="32" rx="3" fill="#ff4d5a"/>
        <line x1="69" y1="45" x2="69" y2="39" stroke="#000" stroke-width="2"/>
        <path id="flame1" class="flame" d="M 69 22 Q 74 32 69 39 Q 64 32 69 22 Z"/>

        <!-- Candle 2 -->
        <rect x="96" y="40" width="8" height="35" rx="3" fill="#ffffff"/>
        <line x1="100" y1="40" x2="100" y2="34" stroke="#000" stroke-width="2"/>
        <path id="flame2" class="flame" d="M 100 17 Q 105 27 100 34 Q 95 27 100 17 Z"/>

        <!-- Candle 3 -->
        <rect x="127" y="45" width="8" height="32" rx="3" fill="#ff4d5a"/>
        <line x1="131" y1="45" x2="131" y2="39" stroke="#000" stroke-width="2"/>
        <path id="flame3" class="flame" d="M 131 22 Q 136 32 131 39 Q 126 32 131 22 Z"/>
      </svg>
    </div>

    <button id="blow-btn" class="btn-glow" onclick="blowCandles()">Blow Out Candles 🎂</button>
  </section>

  <!-- STEP 5: BEACH HOUSE DEPRESSION CHERRY VINYL PLAYER SECTION -->
  <section id="step-playlist" class="fullpage-section hidden">
    <div class="vinyl-player-section">
      
      <!-- Beach House Jacket + Painted Floral Record -->
      <div class="album-display">
        <!-- Depression Cherry Sleeve Jacket -->
        <div class="album-cover">
          <span class="cover-text">beach house</span>
          <span class="cover-text">depression cherry</span>
        </div>

        <!-- Hand Painted Floral Vinyl Disc -->
        <div id="vinyl-disc" class="vinyl-record">
          <svg class="vinyl-svg" viewBox="0 0 300 300">
            <!-- Vinyl Grooves Base -->
            <circle cx="150" cy="150" r="145" fill="#0c0a0c" stroke="#1f1a1f" stroke-width="2"/>
            <circle cx="150" cy="150" r="130" fill="none" stroke="#161316" stroke-width="3"/>
            <circle cx="150" cy="150" r="115" fill="none" stroke="#1a161a" stroke-width="2"/>
            <circle cx="150" cy="150" r="100" fill="none" stroke="#141114" stroke-width="3"/>
            <circle cx="150" cy="150" r="85" fill="none" stroke="#1c181c" stroke-width="2"/>

            <!-- Floral Paint Vines & Blossoms artwork -->
            <path d="M 40 150 Q 80 60 150 40 Q 220 30 250 110" fill="none" stroke="#4d7c0f" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 70 210 Q 140 260 220 220" fill="none" stroke="#3f6212" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Painted Flowers -->
            <circle cx="80" cy="80" r="8" fill="#f43f5e"/>
            <circle cx="95" cy="70" r="6" fill="#fb7185"/>
            <circle cx="150" cy="40" r="9" fill="#c084fc"/>
            <circle cx="210" cy="65" r="7" fill="#38bdf8"/>
            <circle cx="245" cy="110" r="9" fill="#f43f5e"/>
            <circle cx="100" cy="230" r="8" fill="#fbbf24"/>
            <circle cx="180" cy="240" r="10" fill="#e879f9"/>

            <!-- Center Purple Hallmark Label -->
            <circle cx="150" cy="150" r="42" fill="#581c87" stroke="#3b0764" stroke-width="2"/>
            <circle cx="150" cy="150" r="38" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,3"/>
            
            <text x="150" y="145" font-family="Space Mono, monospace" font-size="7" fill="#f3e8ff" text-anchor="middle">BIRTHDAY MIX</text>
            <text x="150" y="156" font-family="Space Mono, monospace" font-size="5" fill="#d8b4fe" text-anchor="middle">STEREO</text>
            
            <!-- Spindle Hole -->
            <circle cx="150" cy="150" r="5" fill="#000000" stroke="#d4d4d8" stroke-width="1"/>
          </svg>
        </div>
      </div>

      <!-- Controls -->
      <div class="audio-player-controls">
        <div class="track-title" id="track-name">Space Song - Beach House</div>
        
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>

        <div class="controls-row">
          <button class="player-btn" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
          <button class="player-btn play-btn-large" id="play-toggle-btn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
          <button class="player-btn" onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
        </div>
      </div>

    </div>
  </section>

  <script>
    /* Dynamic Smooth Cursor Physics */
    const cursor = document.getElementById('blob-cursor');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateCursor() {
      // Smooth lerp follow
      cursorX += (mouseX - cursorX) * 0.18;
      cursorY += (mouseY - cursorY) * 0.18;
      cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0) translate(-50%, -50%)`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Hover effect on buttons/inputs
    document.querySelectorAll('button, input, .cake-container, .album-display').forEach(element => {
      element.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
      element.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
    });

    /* App Logic */
    let userName = "Star";
    let langIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    let typewriterTimeout = null;
    let candlesBlown = false;
    let currentStep = 1;
    let isPlaying = false;
    let currentTrackIdx = 0;

    const playlist = [
      "Space Song - Beach House",
      "PPP - Beach House",
      "Levitation - Beach House"
    ];

    const happyBirthdayLanguages = [
      "Happy Birthday,",
      "¡Feliz Cumpleaños,",
      "Joyeux Anniversaire,",
      "Alles Gute zum Geburtstag,",
      "お誕生日おめでとう,",
      "जन्मदिन की शुभकामनाएं,",
      "Buon Compleanno,",
      "생일 축हा해요,",
      "Feliz Aniversário,"
    ];

    function handleKeyPress(event) {
      if (event.key === "Enter") startGreeting();
    }

    function startGreeting() {
      const inputVal = document.getElementById("user-name-input").value.trim();
      if (inputVal !== "") userName = inputVal;

      currentStep = 2;
      document.getElementById("step-name").classList.add("hidden");
      document.getElementById("step-greeting").classList.remove("hidden");
      document.getElementById("corner-back-btn").classList.remove("hidden");
      document.getElementById("user-name-display").innerText = userName;

      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

      langIndex = 0;
      charIndex = 0;
      isDeleting = false;
      clearTimeout(typewriterTimeout);
      typewriterLoop();
    }

    function typewriterLoop() {
      const currentPhrase = happyBirthdayLanguages[langIndex];
      const typewriterEl = document.getElementById("typewriter-text");

      if (isDeleting) {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex + 1);
        charIndex++;
      }

      let typingSpeed = isDeleting ? 40 : 80;

      if (!isDeleting && charIndex === currentPhrase.length) {
        typingSpeed = 1500;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        langIndex = (langIndex + 1) % happyBirthdayLanguages.length;
        typingSpeed = 300;
      }

      typewriterTimeout = setTimeout(typewriterLoop, typingSpeed);
    }

    function goToLightsStep() {
      clearTimeout(typewriterTimeout);
      currentStep = 3;
      document.getElementById("step-greeting").classList.add("hidden");
      document.getElementById("step-lights").classList.remove("hidden");
    }

    function turnOnLightsAndShowCake() {
      document.body.classList.add("lights-active");
      document.getElementById("lights-strip").classList.add("on");

      confetti({ particleCount: 90, spread: 80, origin: { y: 0.2 } });

      setTimeout(() => {
        currentStep = 4;
        document.getElementById("step-lights").classList.add("hidden");
        document.getElementById("step-main").classList.remove("hidden");
        document.getElementById("step-playlist").classList.remove("hidden");
        document.getElementById("welcome-header").innerText = `Happy Birthday, ${userName}! 🎉`;

        confetti({ particleCount: 140, spread: 100, origin: { y: 0.5 } });
      }, 700);
    }

    function handleCornerBack() {
      if (currentStep === 4) {
        document.getElementById("step-main").classList.add("hidden");
        document.getElementById("step-playlist").classList.add("hidden");
        document.getElementById("step-lights").classList.remove("hidden");
        document.getElementById("lights-strip").classList.remove("on");
        document.body.classList.remove("lights-active");
        currentStep = 3;
      } else if (currentStep === 3) {
        document.getElementById("step-lights").classList.add("hidden");
        document.getElementById("step-greeting").classList.remove("hidden");
        currentStep = 2;
        langIndex = 0;
        charIndex = 0;
        isDeleting = false;
        clearTimeout(typewriterTimeout);
        typewriterLoop();
      } else if (currentStep === 2) {
        clearTimeout(typewriterTimeout);
        document.getElementById("step-greeting").classList.add("hidden");
        document.getElementById("corner-back-btn").classList.add("hidden");
        document.getElementById("step-name").classList.remove("hidden");
        currentStep = 1;
      }
    }

    function blowCandles() {
      if (candlesBlown) return;
      candlesBlown = true;

      document.getElementById("flame1").classList.add("blown-out");
      document.getElementById("flame2").classList.add("blown-out");
      document.getElementById("flame3").classList.add("blown-out");

      document.querySelector(".wish-text").innerText = "Your wish has been made! ✨";
      document.getElementById("blow-btn").innerText = "Wish Made! 🎉";

      confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 } });
    }

    /* Vinyl Music Control */
    function togglePlay() {
      isPlaying = !isPlaying;
      const vinyl = document.getElementById("vinyl-disc");
      const playBtn = document.getElementById("play-toggle-btn");

      if (isPlaying) {
        vinyl.classList.add("spinning");
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      } else {
        vinyl.classList.remove("spinning");
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
      }
    }

    function nextTrack() {
      currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
      updateTrackDisplay();
    }

    function prevTrack() {
      currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length;
      updateTrackDisplay();
    }

    function updateTrackDisplay() {
      document.getElementById("track-name").innerText = playlist[currentTrackIdx];
    }
  </script>
</body>
</html>
